# Ansible Rhel Workstation Builder Workflow Add New Ansible Role

## Action

Follow the add-new-ansible-role workflow:
1. Create role directory under roles/<role-name>/
2. Add README.md and AGENTS.md for documentation/context
3. Add defaults/main.yml, handlers/main.yml, meta/main.yml, tasks/main.yml, and (optionally) vars/main.yml
4. Add templates/ and/or files/ as needed for configuration/scripts
5. Add tests/inventory and tests/test.yml for role testing
6. Update playbooks/<playbook>.yml to include the new role if needed

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: roles/<role-name>/README.md, roles/<role-name>/defaults/main.yml, roles/<role-name>/handlers/main.yml

