---
# ============================================================================
# Base Configuration
# Provides foundational system setup and repository configuration
# ============================================================================

# ----------------------------------------------------------------------------
# System Configuration
# ----------------------------------------------------------------------------

- name: Set System Timezone
  become: true
  ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
  register: timezone_result
  changed_when: timezone_result.rc == 0
  failed_when: timezone_result.rc != 0
  tags: ["timezone", "base", "common"]

- name: Disable Core Dumps
  become: true
  block:
    - name: Create coredump directory
      ansible.builtin.file:
        path: /etc/systemd/coredump.conf.d
        state: directory
        mode: "0755"

    - name: Disable core dumps
      ansible.builtin.copy:
        dest: /etc/systemd/coredump.conf.d/disable-coredumps.conf
        content: |
          [Coredump]
          Storage=none
          ProcessSizeMax=0
        mode: "0644"
  
  notify: Daemon reload
  tags: ["core_dumps", "base", "systemd"]

- name: Set CPU Power Max Frequency
  become: true
  block:
    - name: Ensure the Kernel Tools package is installed
      ansible.builtin.package:
        name: kernel-tools
        state: present

    - name: Deploy cpupower-service configuration
      ansible.builtin.template:
        src: etc/cpupower-service.conf.j2
        dest: /etc/cpupower-service.conf
        owner: root
        group: root
        mode: "0644"
        backup: true

    - name: Enable cpupower service
      ansible.builtin.systemd:
        name: cpupower
        enabled: true
        state: started

  rescue:
    - name: Log cpupower configuration failure
      ansible.builtin.debug:
        msg: >
          Failed to configure cpupower settings.
          Error details: {{ ansible_failed_result | default('Unknown error') }}
          CPU power management may need to be configured manually.

    - name: Mark cpupower configuration as failed
      ansible.builtin.set_fact:
        cpupower_config_failed: true

  notify: Restart cpupower service
  tags: ["cpupower", "base", "systemd"]


# ----------------------------------------------------------------------------
# DNF Performance Optimization
# ----------------------------------------------------------------------------

- name: Include DNF configuration tasks
  ansible.builtin.include_tasks: dnf.yml
  tags: ["dnf_configuration", "base", "repos"]

# ----------------------------------------------------------------------------
# Repository Configuration
# ----------------------------------------------------------------------------

- name: Include Distribution Specific Repository Tasks
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"
  when:
    - enable_third_party_repos | default(true)
  tags: ["repos", "base"]

# ----------------------------------------------------------------------------
# RPM Package Installation
# ----------------------------------------------------------------------------

- name: Include Package Installation Tasks
  ansible.builtin.import_tasks: packages.yml
  tags: ["packages", "builder", "base", "common"]

# ----------------------------------------------------------------------------
# Rust Package Installation
# ----------------------------------------------------------------------------

- name: Install Rust Packages
  block:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Check if 'cargo' is installed
      ansible.builtin.debug:
        msg: "'cargo' is installed"
      when: "'cargo' in ansible_facts.packages"

    - name: Install Rust Packages with locked dependencies
      community.general.cargo:
        name: "{{ item }}"
        locked: true
      loop:
        - bottom
        - eza
        - git-cliff
        - gping
        - ripgrep_all
        - sd
      loop_control:
        label: "{{ item }}"
      when:
        - "'cargo' in ansible_facts.packages"

  rescue:
    - name: Log Rust package installation failure
      ansible.builtin.debug:
        msg: >
          Failed to install Rust packages.
          Error details: {{ ansible_failed_result | default('Unknown error') }}
          You may need to run 'cargo install <package_name>' manually.
      tags: ["cargo_install"]

    - name: Mark Rust package installation as failed
      ansible.builtin.set_fact:
        rust_package_installation_failed: true
      tags: ["cargo_install"]

  tags: ["cargo", "packages"]

# ----------------------------------------------------------------------------
# Bun Package Installation
# ----------------------------------------------------------------------------

- name: Install Bun
  ansible.builtin.shell: "curl -fsSL https://bun.sh/install | bash"
  tags: ["bun"]

# ----------------------------------------------------------------------------
# Generative AI CLI Tool Installation
# ----------------------------------------------------------------------------

- name: Install Generative AI CLI Tools
  block:
    - name: Install Gemini CLI
      ansible.builtin.shell: "bun add -g @google/gemini-cli@latest"
      tags: ["gemini"]

    - name: Install Claude CLI
      ansible.builtin.shell: "curl -fsSL https://claude.ai/install.sh | bash"
      tags: ["claude"]

    - name: Install Opencode AI
      ansible.builtin.shell: "bun add -g opencode-ai@latest"
      tags: ["opencode"]

    - name: Install Oh My Opencode
      ansible.builtin.shell: |
        bunx oh-my-opencode install --no-tui \
        --claude=yes \
        --gemini=yes \
        --copilot=no \
        --openai=no \
        --opencode-zen=yes \
        --zai-coding-plan=no
      tags: ["opencode"]

  rescue:
    - name: Log Generative AI CLI Tool installation failure
      ansible.builtin.debug:
        msg: >
          Failed to install one or more of the Generative AI CLI tools
          Error details: {{ ansible_failed_result | default('Unknown error') }}
          These tools may need to be installed manually.
      tags: ["development_tools_error"]

    - name: Mark Generative AI CLI Tool installation as failed
      ansible.builtin.set_fact:
        ai_tool_installation_failed: true
      tags: ["development_tools_error"]

  tags: ["development_tools", "gemini", "claude", "opencode", "genai"]