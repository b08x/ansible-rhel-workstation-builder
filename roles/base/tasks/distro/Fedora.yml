---
# ============================================================================
# Fedora Repository and DNF Configuration
# Sets up third-party repositories and optimizes DNF performance
# ============================================================================

- name: Install repository management prerequisites
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop:
    - python3-libdnf5
    - fedora-workstation-repositories
  become: true
  tags: ["packages", "packages__repos"]

# ----------------------------------------------------------------------------
# Repository Configuration
# ----------------------------------------------------------------------------

- name: Configure third-party repositories
  become: true
  block:
    - name: Install RPM Fusion Free repository
      ansible.builtin.dnf:
        name: "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present
        disable_gpg_check: true
      tags: ["rpmfusion"]

    - name: Install RPM Fusion Non-Free repository
      ansible.builtin.dnf:
        name: "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present
        disable_gpg_check: true
      tags: ["rpmfusion"]

    - name: Add YADM repository
      ansible.builtin.get_url:
        url: "https://download.opensuse.org/repositories/home:TheLocehiliosan:yadm/Fedora_{{ ansible_distribution_major_version }}/home:TheLocehiliosan:yadm.repo"
        dest: /etc/yum.repos.d/home:TheLocehiliosan:yadm.repo
        mode: "0644"
      tags: ["yadm"]

    - name: Set repository priorities
      ansible.builtin.shell: |
        dnf config-manager setopt fedora.priority=0 updates.priority=0 rpmfusion-*.priority=90
      changed_when: false
      tags: ["dnf_priorities"]

  rescue:
    - name: Log repository setup failure
      ansible.builtin.debug:
        msg: >
          Failed to set up repositories.
          Error details: {{ ansible_failed_result | default('Unknown error') }}
          This might be due to network connectivity issues or repository availability.
      tags: ["repo_setup"]

    - name: Mark repository setup as failed
      ansible.builtin.set_fact:
        repository_setup_failed: true
      tags: ["repo_setup"]

  tags: ["repositories"]


