---
- name: Add YADM repository
  ansible.builtin.get_url:
    url: "https://download.opensuse.org/repositories/home:TheLocehiliosan:yadm/Fedora_{{ ansible_distribution_major_version }}/home:TheLocehiliosan:yadm.repo"
    dest: /etc/yum.repos.d/home:TheLocehiliosan:yadm.repo
    mode: "0644"
  when: ansible_distribution == "Fedora"
  become: true
  tags: ["yadm", "repos"]

- name: Install yadm
  ansible.builtin.dnf:
    name: yadm
    state: present
  become: true
  tags: ["yadm", "packages"]
