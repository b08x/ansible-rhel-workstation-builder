---
# tasks file for workstation

- name: Setup Terra repository
  become: true
  block:
    - name: Install terra-release for Fedora 42+
      ansible.builtin.shell:
        cmd: dnf install -y --nogpgcheck --repofrompath 'terra,https://repos.fyralabs.com/terra$releasever' terra-release
      when:
        - ansible_distribution == 'Fedora'
        - ansible_distribution_major_version | int >= 42
      args:
        creates: /etc/yum.repos.d/terra.repo

    - name: Install terra-release for Rocky 10
      ansible.builtin.shell:
        cmd: dnf install -y --nogpgcheck --repofrompath 'terra,https://repos.fyralabs.com/terrael$releasever' terra-release
      when:
        - ansible_distribution == 'Rocky'
        - ansible_distribution_major_version | int == 10
      args:
        creates: /etc/yum.repos.d/terra.repo

    - name: Set Terra repository priority
      ansible.builtin.command: dnf config-manager setopt terra.priority=95
      changed_when: false
      tags: ["dnf_priorities", "terra"]

  rescue:
    - name: Log Terra repository setup failure
      ansible.builtin.debug:
        msg: >
          Failed to set up Terra repository.
          Error details: {{ ansible_failed_result | default('Unknown error') }}
          This might be due to network connectivity issues or repository availability.
      tags: ["terra", "repo_setup"]

    - name: Mark Terra repository setup as failed
      ansible.builtin.set_fact:
        terra_repo_setup_failed: true
      tags: ["terra", "repo_setup"]

  tags: ["terra"]

# TODO: run ydotoold as a user service (systemctl --user enable ydotool.service), which creates the socket in your user's runtime directory (e.g., /run/user/1000/.ydotool_socket) 
- name: Adjust ydotool socket permissions
  become: true
  block:
    - name: Adjust Permissions for the ydotool Socket File
      ansible.builtin.copy:
        dest: /usr/lib/systemd/system/ydotool.service
        content: |
          [Unit]
          Description=Starts ydotoold service

          [Service]
          Type=simple
          Restart=always
          Group=input
          ExecStart=
          ExecStart=/usr/bin/ydotoold --socket-perm 0660
          ExecReload=/usr/bin/kill -HUP $MAINPID
          KillMode=process
          TimeoutSec=180

          [Install]
          WantedBy=default.target
        mode: "0666"
        backup: true
      notify: Daemon reload
  
    - name: Trigger handlers
      meta: flush_handlers

    - name: Restart ydotool service
      ansible.builtin.systemd:
        name: ydotool
        state: restarted    

  rescue:
    - name: Log ydotool installation failure
      ansible.builtin.debug:
        msg: >
          Failed to install ydotool.
          Error details: {{ ansible_failed_result | default('Unknown error') }}
          You may need to run 'systemctl restart ydotool' manually.

    - name: Mark ydotool installation as failed
      ansible.builtin.set_fact:
        ydotool_installation_failed: true
  
  tags: ["ydotool"]

- include_tasks: browser.yml
- include_tasks: ide.yml

