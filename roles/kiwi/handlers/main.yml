---
# handlers file for kiwi role

# ============================================================================
# Build Completion Handler
# ============================================================================

- name: kiwi_build_complete
  ansible.builtin.debug:
    msg:
      - "============================================================================"
      - "Handler: KIWI Build Complete"
      - "============================================================================"
      - "This handler can be extended to perform post-build actions such as:"
      - "  - Uploading ISO to artifact storage (S3, Artifactory, etc.)"
      - "  - Sending notifications (email, Slack, etc.)"
      - "  - Triggering CI/CD pipelines"
      - "  - Updating documentation"
      - "  - Running integration tests"
      - "============================================================================"

# ============================================================================
# SELinux Restoration Handler
# ============================================================================

- name: restore_selinux
  ansible.builtin.command: setenforce 1
  become: true
  when:
    - original_selinux_state is defined
    - original_selinux_state == "Enforcing"
  ignore_errors: true

# ============================================================================
# Cleanup Handler
# ============================================================================

- name: cleanup_build_artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ kiwi_build_dir }}"
  become: true
  when: kiwi_clean_build_dir | default(false)
