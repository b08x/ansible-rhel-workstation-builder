---
# meta/main.yml - Ansible Galaxy metadata for kiwi role

galaxy_info:
  role_name: kiwi
  author: Platform Engineering
  description: Automate the generation of custom Fedora 43 Workstation ISO images using KIWI NG
  company: Platform Engineering

  # License for the role
  license: MIT

  # Minimum Ansible version required
  min_ansible_version: "2.14"

  # Platforms this role supports
  platforms:
    - name: Fedora
      versions:
        - "43"

  # Categories for Ansible Galaxy
  galaxy_tags:
    - system
    - fedora
    - kiwi
    - iso
    - image
    - builder
    - workstation
    - nvidia
    - oneapi
    - ai
    - hpc
    - gnome
    - sway

# Role dependencies
dependencies: []
  # This role can optionally use the 'repos' role for repository management
  # but it's not a hard dependency as it manages its own repositories
  # Uncomment below if you want to integrate with the repos role:
  # - role: repos
  #   when: kiwi_use_repos_role | default(false)

# Collections this role depends on
collections:
  - ansible.builtin
