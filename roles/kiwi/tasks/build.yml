---
# Execute KIWI NG build process

# ============================================================================
# Pre-Build Validation
# ============================================================================

- name: Display build start information
  ansible.builtin.debug:
    msg:
      - "============================================================================"
      - "Starting KIWI NG Build Process"
      - "============================================================================"
      - "Image: {{ kiwi_image_name }} v{{ kiwi_image_version }}"
      - "Profile: {{ kiwi_profile }}"
      - "Description directory: {{ kiwi_build_dir }}"
      - "Target directory: {{ kiwi_output_dir }}"
      - ""
      - "This process may take 45-90 minutes depending on:"
      - "  - Network bandwidth (downloading ~20GB of packages)"
      - "  - CPU performance (compression and squashfs creation)"
      - "  - Disk I/O speed"
      - ""
      - "The build will run asynchronously - you can monitor progress with:"
      - "  tail -f {{ kiwi_log_file }}"
      - "============================================================================"

# ============================================================================
# Create Log Directory
# ============================================================================

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ kiwi_log_file | dirname }}"
    state: directory
    mode: '0755'
  become: true

# ============================================================================
# Execute KIWI Build (Async)
# ============================================================================

- name: Execute KIWI NG system build
  ansible.builtin.command:
    cmd: >
      kiwi-ng
      {% if kiwi_verbose %}--debug{% endif %}
      system build
      --description {{ kiwi_build_dir }}
      --target-dir {{ kiwi_output_dir }}
      {% if kiwi_allow_existing_root %}--allow-existing-root{% endif %}
      {{ kiwi_additional_build_flags }}
  async: "{{ kiwi_async_timeout }}"
  poll: 0
  register: kiwi_build_job
  become: true
  changed_when: true

- name: Display async job information
  ansible.builtin.debug:
    msg:
      - "KIWI build started asynchronously"
      - "Job ID: {{ kiwi_build_job.ansible_job_id }}"
      - "Timeout: {{ kiwi_async_timeout }} seconds ({{ (kiwi_async_timeout / 60) | int }} minutes)"
      - "Polling interval: {{ kiwi_async_poll }} seconds"

# ============================================================================
# Wait for Build Completion
# ============================================================================

- name: Wait for KIWI build completion
  ansible.builtin.async_status:
    jid: "{{ kiwi_build_job.ansible_job_id }}"
  register: job_result
  until: job_result.finished
  retries: "{{ (kiwi_async_timeout / kiwi_async_poll) | int }}"
  delay: "{{ kiwi_async_poll }}"
  become: true

- name: Display build completion status
  ansible.builtin.debug:
    msg:
      - "KIWI build completed!"
      - "Return code: {{ job_result.rc }}"
      - "Execution time: {{ job_result.delta if job_result.delta is defined else 'N/A' }}"

# ============================================================================
# Handle Build Failure
# ============================================================================

- name: Check for build failure
  ansible.builtin.fail:
    msg: |
      KIWI build failed with return code {{ job_result.rc }}

      Error output:
      {{ job_result.stderr | default('No error output available') }}

      Please check the following:
      1. Sufficient disk space (50GB+ required)
      2. Network connectivity to repositories
      3. SELinux is in Permissive mode
      4. All required packages are available in repositories

      For detailed logs, check: {{ kiwi_log_file }}
  when:
    - job_result.rc is defined
    - job_result.rc != 0

# ============================================================================
# Restore SELinux (if needed)
# ============================================================================

- name: Restore SELinux to original state
  ansible.builtin.command: setenforce 1
  when:
    - kiwi_restore_selinux | bool
    - original_selinux_state is defined
    - original_selinux_state == "Enforcing"
  become: true
  ignore_errors: true
  register: selinux_restored

- name: Display SELinux restoration status
  ansible.builtin.debug:
    msg: "SELinux restored to {{ original_selinux_state }} mode"
  when:
    - selinux_restored is defined
    - selinux_restored.changed

# ============================================================================
# Find Generated Artifacts
# ============================================================================

- name: Find generated ISO file
  ansible.builtin.find:
    paths: "{{ kiwi_output_dir }}"
    patterns: "*.iso"
    recurse: true
  register: generated_iso
  become: true

- name: Find other generated files
  ansible.builtin.find:
    paths: "{{ kiwi_output_dir }}"
    patterns:
      - "*.kernel"
      - "*.initrd"
      - "*.squashfs"
      - "*.md5"
      - "*.sha256"
    recurse: true
  register: generated_artifacts
  become: true

# ============================================================================
# Verify ISO Was Created
# ============================================================================

- name: Verify ISO was generated
  ansible.builtin.fail:
    msg: |
      KIWI build completed but no ISO file was found in {{ kiwi_output_dir }}

      This may indicate a build configuration issue. Please check:
      1. The KIWI output directory: {{ kiwi_output_dir }}
      2. KIWI build logs for warnings or errors
      3. The image type configuration in config.xml

      Generated files found: {{ generated_artifacts.matched }}
  when: generated_iso.matched == 0

# ============================================================================
# Calculate File Sizes and Checksums
# ============================================================================

- name: Get ISO file details
  ansible.builtin.stat:
    path: "{{ generated_iso.files[0].path }}"
    checksum_algorithm: sha256
  register: iso_details
  become: true
  when: generated_iso.matched > 0

- name: Set ISO path fact
  ansible.builtin.set_fact:
    kiwi_iso_path: "{{ generated_iso.files[0].path }}"
    kiwi_iso_size_gb: "{{ (iso_details.stat.size / 1024 / 1024 / 1024) | round(2) }}"
    kiwi_iso_checksum: "{{ iso_details.stat.checksum }}"
  when: generated_iso.matched > 0

# ============================================================================
# Create Build Manifest
# ============================================================================

- name: Create build manifest
  ansible.builtin.copy:
    content: |
      ============================================================================
      KIWI Build Manifest
      ============================================================================
      Image Name: {{ kiwi_image_name }}
      Image Version: {{ kiwi_image_version }}
      Build Date: {{ ansible_date_time.iso8601 }}
      Build Host: {{ ansible_hostname }}

      Build Configuration:
        - Fedora Version: {{ fedora_version }}
        - Profile: {{ kiwi_profile }}
        - Root Size: {{ kiwi_root_size_gb }}GB

      Features:
        - GNOME: {{ kiwi_enable_gnome }}
        - Sway: {{ kiwi_enable_sway }}
        - NVIDIA: {{ kiwi_enable_nvidia }}
        - Intel oneAPI: {{ kiwi_enable_oneapi }}

      Generated ISO:
        - Location: {{ kiwi_iso_path }}
        - Size: {{ kiwi_iso_size_gb }}GB ({{ (iso_details.stat.size / 1024 / 1024) | round(0) | int }}MB)
        - SHA256: {{ kiwi_iso_checksum }}

      Additional Artifacts: {{ generated_artifacts.matched }} files
      {% if generated_artifacts.matched > 0 %}
      {% for file in generated_artifacts.files %}
        - {{ file.path | basename }} ({{ (file.size / 1024 / 1024) | round(2) }}MB)
      {% endfor %}
      {% endif %}

      Build Statistics:
        - Duration: {{ job_result.delta if job_result.delta is defined else 'N/A' }}
        - Return Code: {{ job_result.rc }}

      Verification:
        To verify the ISO integrity:
        echo "{{ kiwi_iso_checksum }}  {{ kiwi_iso_path }}" | sha256sum -c

        To test the ISO in QEMU:
        qemu-system-x86_64 -m 8G -enable-kvm -boot d -cdrom {{ kiwi_iso_path }}

      ============================================================================
    dest: "{{ kiwi_output_dir }}/BUILD_MANIFEST.txt"
    mode: '0644'
  become: true
  when: generated_iso.matched > 0

# ============================================================================
# Display Build Results
# ============================================================================

- name: Display build results
  ansible.builtin.debug:
    msg:
      - "============================================================================"
      - "KIWI Build Completed Successfully!"
      - "============================================================================"
      - "ISO Location: {{ kiwi_iso_path }}"
      - "ISO Size: {{ kiwi_iso_size_gb }}GB"
      - "SHA256: {{ kiwi_iso_checksum }}"
      - ""
      - "Additional artifacts: {{ generated_artifacts.matched }} files in {{ kiwi_output_dir }}"
      - ""
      - "Next Steps:"
      - "1. Verify ISO: sha256sum -c {{ kiwi_output_dir }}/BUILD_MANIFEST.txt"
      - "2. Test ISO: qemu-system-x86_64 -m 8G -enable-kvm -boot d -cdrom {{ kiwi_iso_path }}"
      - "3. Write to USB: sudo dd if={{ kiwi_iso_path }} of=/dev/sdX bs=4M status=progress"
      - ""
      - "Build manifest: {{ kiwi_output_dir }}/BUILD_MANIFEST.txt"
      - "============================================================================"
  when: generated_iso.matched > 0

# ============================================================================
# Trigger Handler (if defined)
# ============================================================================

- name: Notify build completion handler
  ansible.builtin.command: /bin/true
  notify: kiwi_build_complete
  changed_when: true
  when: generated_iso.matched > 0
