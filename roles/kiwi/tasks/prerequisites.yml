---
# Install KIWI NG and build dependencies

# ============================================================================
# Package Installation
# ============================================================================

- name: Install KIWI NG and required packages
  ansible.builtin.dnf:
    name:
      # Core KIWI packages
      - kiwi-cli
      - python3-kiwi
      - kiwi-systemdeps-core
      - kiwi-systemdeps-iso-media
      # Image creation tools
      - qemu-img
      - xorriso
      - squashfs-tools
      - dracut-kiwi-live
      # Development and build tools
      - git
      - distribution-gpg-keys
      - libxml2
      # Additional utilities
      - rsync
      - dosfstools
      - parted
    state: present
  register: dnf_install
  retries: 3
  delay: 10
  until: dnf_install is success
  become: true

# ============================================================================
# KIWI Verification
# ============================================================================

- name: Verify KIWI installation
  ansible.builtin.command: kiwi-ng --version
  register: kiwi_version
  changed_when: false
  failed_when: kiwi_version.rc != 0

- name: Display KIWI version
  ansible.builtin.debug:
    msg: "KIWI NG version: {{ kiwi_version.stdout }}"

# ============================================================================
# xmllint Availability Check
# ============================================================================

- name: Check if xmllint is available
  ansible.builtin.command: which xmllint
  register: xmllint_check
  changed_when: false
  failed_when: false

- name: Install libxml2 if xmllint is missing
  ansible.builtin.dnf:
    name: libxml2
    state: present
  become: true
  when: xmllint_check.rc != 0

# ============================================================================
# System Preparation
# ============================================================================

- name: Ensure /etc/cdi directory exists for NVIDIA CDI
  ansible.builtin.file:
    path: /etc/cdi
    state: directory
    mode: '0755'
  become: true
  when: kiwi_enable_nvidia

- name: Display prerequisites completion
  ansible.builtin.debug:
    msg:
      - "Prerequisites installation complete"
      - "KIWI NG is ready to build images"
