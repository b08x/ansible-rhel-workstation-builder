---
# tasks file for asdf

- name: ASDF Tasks
  become: true
  block:
    - name: Install System Dependencies
      ansible.builtin.dnf:
        name: "{{ asdf_dependencies }}"
        state: present
        update_cache: yes
      tags: ["asdf_install", "dependencies"]

    - name: Clone asdf repository
      ansible.builtin.git:
        repo: https://github.com/asdf-vm/asdf.git
        dest: "{{ asdf_install_path }}"
        version: master
        update: yes
      register: asdf_clone_result
      tags: ["asdf_install", "git"]

    - name: Set asdf directory ownership and permissions
      ansible.builtin.file:
        path: "{{ asdf_install_path }}"
        state: directory
        owner: "{{ user.name }}"
        group: "{{ user.group }}"
        mode: '0755'
        recurse: yes
      tags: ["asdf_install", "permissions"]

    - name: Run make to build asdf
      ansible.builtin.make:
        chdir: "{{ asdf_install_path }}"
      tags: ["asdf_install", "asdf_build"]

    - name: Copy asdf to bin directory
      ansible.builtin.copy:
        src: "{{ asdf_install_path }}/asdf"
        dest: "{{ asdf_install_path }}/bin/asdf"
        owner: "{{ user.name }}"
        group: "{{ user.group }}"
        mode: '0755'
      tags: ["asdf_install", "permissions"]
  rescue:
    - name: Log asdf setup failure
      ansible.builtin.debug:
        msg: >
          Failed to set up asdf.
          Error details: {{ ansible_failed_result | default('Unknown error') }}
          This might be due to network connectivity issues or repository availability.
      tags: ["asdf_setup"]

    - name: Mark asdf setup as failed
      ansible.builtin.set_fact:
        asdf_setup_failed: true
      tags: ["asdf_setup"]


