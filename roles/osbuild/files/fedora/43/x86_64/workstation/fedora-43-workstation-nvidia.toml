[[customizations.files]]
path = "/usr/local/sbin/custom-first-boot"
mode = "0774"
data = """
#!/usr/bin/ansible-playbook -i localhost

- name: Install Intel oneAPI MKL
  hosts: localhost
  connection: local

  tasks:
    - name: Import Intel oneAPI GPG Key
      rpm_key:
        state: present
        key: https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
        validate_certs: true

    - name: Add Intel openAPI Repository
      yum_repository:
        name: oneAPI
        description: "Intel® oneAPI repository"
        baseurl: https://yum.repos.intel.com/oneapi
        enabled: true
        gpgcheck: true
        gpgkey: https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB

    - name: Update Package Cache
      dnf:
        update_cache: true

    - name: Install Intel oneAPI MKL
      dnf:
        name: intel-oneapi-mkl-devel
        state: present

    - name: Create oneAPI Environment Profile Script
      copy:
        dest: /etc/profile.d/intel-oneapi.sh
        content: |
            #!/bin/bash
            # Initialize Intel oneAPI environment variables on login
            if [ -f /opt/intel/oneapi/setvars.sh ]; then
                source /opt/intel/oneapi/setvars.sh --force > /dev/null 2>&1
            fi
        mode: '0755'
        owner: root
        group: root

    - name: Set repo priorities
      shell: |
        dnf config-manager setopt fedora.priority=0 updates.priority=0 \
        cuda-fedora43-x86_64.priority=99 \
        rpmfusion-free.priority=100 \
        rpmfusion-nonfree.priority=100 \
        rpmfusion-free-updates.priority=100 \
        rpmfusion-nonfree-updates.priority=100 \
        rpmfusion-nonfree-nvidia-driver.priority=100

    - name: Set Graphical Target
      shell: systemctl set-default graphical.target
"""

[[customizations.files]]
path = "/etc/systemd/system/custom-first-boot.service"
data = """
[Unit]
ConditionPathExists=/usr/local/sbin/custom-first-boot
Wants=network-online.target
After=network-online.target
After=osbuild-first-boot.service

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/custom-first-boot
ExecStartPost=mv /usr/local/sbin/custom-first-boot /usr/local/sbin/custom-first-boot-done

[Install]
WantedBy=multi-user.target
"""

[[customizations.files]]
path = "/usr/local/bin/nvidia-cdi-generate.sh"
mode = "0755"
data = """
#!/bin/bash
# Generate NVIDIA CDI specification for Podman container GPU access
# This script waits for NVIDIA device nodes to appear before generating CDI config

set -euo pipefail

timeout=30
echo "Waiting for NVIDIA device nodes..."

while [ $timeout -gt 0 ]; do
  if [ -e /dev/nvidia0 ]; then
    echo "NVIDIA device found, generating CDI specification..."
    mkdir -p /etc/cdi
    nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    echo "CDI specification generated successfully at /etc/cdi/nvidia.yaml"
    exit 0
  fi
  sleep 1
  ((timeout--))
done

echo "ERROR: NVIDIA device not found after 30 seconds" >&2
echo "This may indicate:" >&2
echo "  - NVIDIA driver not loaded" >&2
echo "  - No NVIDIA GPU present" >&2
echo "  - Driver compilation failed" >&2
exit 1
"""

[[customizations.files]]
path = "/etc/systemd/system/nvidia-cdi-refresh.service"
data = """
[Unit]
Description=Generate NVIDIA CDI specification for Podman
Documentation=https://github.com/NVIDIA/nvidia-container-toolkit
Wants=network-online.target
After=network-online.target
After=custom-first-boot.service
ConditionPathExists=/usr/bin/nvidia-ctk
ConditionPathExists=/usr/local/bin/nvidia-cdi-generate.sh

[Service]
Type=oneshot
ExecStart=/usr/local/bin/nvidia-cdi-generate.sh
RemainAfterExit=true
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=multi-user.target
"""

