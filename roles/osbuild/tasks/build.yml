---
# Build execution for image-builder

- name: Display build configuration
  ansible.builtin.debug:
    msg: |
      Starting build for blueprint: {{ blueprint_name }}
      Image type: {{ osbuild_image_type }}
      Distribution: {{ osbuild_distro }}
      Timeout: {{ osbuild_build_timeout }} seconds
      Output directory: {{ osbuild_output_dir }}

- name: Initialize build status
  ansible.builtin.set_fact:
    build_status: "RUNNING"

- name: Execute image-builder build
  block:
    - name: Run image-builder (synchronous)
      ansible.builtin.command: >
        image-builder build {{ osbuild_image_type }} 
        --distro {{ osbuild_distro }} 
        --blueprint {{ osbuild_output_dir }}/{{ blueprint_name }}.toml
      args:
        chdir: "{{ osbuild_output_dir }}"
      register: image_build_exec
      become: true
      async: "{{ osbuild_build_timeout }}"
      poll: 30

    - name: Set build status to finished
      ansible.builtin.set_fact:
        build_status: "FINISHED"

  rescue:
    - name: Set build status to failed
      ansible.builtin.set_fact:
        build_status: "FAILED"

    - name: Capture failure logs
      ansible.builtin.copy:
        content: |
          Build Failure Report
          ====================
          Timestamp: {{ ansible_date_time.iso8601 }}
          Blueprint: {{ blueprint_name }}
          Image Type: {{ osbuild_image_type }}
          Distribution: {{ osbuild_distro }}
          Status: FAILED

          STDOUT:
          {{ image_build_exec.stdout | default('No stdout captured') }}

          STDERR:
          {{ image_build_exec.stderr | default('No stderr captured') }}
        dest: "{{ osbuild_log_dir }}/build-failure-{{ ansible_date_time.epoch }}.log"
        mode: '0644'
      when: osbuild_keep_logs | bool

- name: Handle successful build
  when: build_status == "FINISHED"
  block:
    - name: Display success message
      ansible.builtin.debug:
        msg: "Build completed successfully."

    - name: Find generated image file
      ansible.builtin.find:
        paths: "{{ osbuild_output_dir }}"
        patterns: "composer-api-*.iso,composer-api-*.qcow2,composer-api-*.img,*.iso,*.qcow2,*.img"
        use_regex: false
      register: image_files

    - name: Verify image exists
      ansible.builtin.assert:
        that:
          - image_files.files | length > 0
        fail_msg: "Image build reported success but no image file was found"

    - name: Rename image to friendly name
      ansible.builtin.copy:
        src: "{{ (image_files.files | sort(attribute='mtime', reverse=true) | first).path }}"
        dest: "{{ osbuild_output_dir }}/{{ osbuild_output_filename }}"
        mode: '0644'
        remote_src: true
      when: image_files.files | length > 0

    - name: Get image file info
      ansible.builtin.stat:
        path: "{{ osbuild_output_dir }}/{{ osbuild_output_filename }}"
      register: final_image

    - name: Display build summary
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║              BUILD COMPLETED SUCCESSFULLY                      ║
          ╚════════════════════════════════════════════════════════════════╝

          Blueprint: {{ blueprint_name }}
          Image Type: {{ osbuild_image_type }}
          Distribution: {{ osbuild_distro }}

          Output File: {{ osbuild_output_dir }}/{{ osbuild_output_filename }}
          Image Size: {{ (final_image.stat.size / 1024 / 1024 / 1024) | round(2) }} GB

- name: Finalize build failure
  when: build_status == "FAILED"
  ansible.builtin.fail:
    msg: |
      Image build failed. 
      Check logs at {{ osbuild_log_dir }}/build-failure-*.log for details.
