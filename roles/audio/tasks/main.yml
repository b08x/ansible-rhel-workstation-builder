---
- name: Load distribution-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  tags: ["packages"]

- name: Starting audio role tasks
  ansible.builtin.debug:
    msg: "Starting audio tasks"

- name: Add modprobe option to not use a usb card as the default device
  ansible.builtin.copy:
    content: |
      # Managed by Ansible - do not edit manually
      options snd slots=snd-hda-intel,snd-usb-audio
    dest: /etc/modprobe.d/10-alsa_usb.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  tags: ['modprobe']

- name: Install ALSA packages
  ansible.builtin.dnf:
    name: "{{ audio_packages.alsa }}"
    state: present
  when: ansible_os_family == "RedHat"


- ansible.builtin.import_tasks:
    file: tuning.yml
  tags: ["tuning"]

- import_tasks:
    file: noisetorch.yml
  become: false
  tags: ['noisetorch']