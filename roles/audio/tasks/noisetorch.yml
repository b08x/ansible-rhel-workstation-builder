---
# tasks file for installing noisetorch from source

- name: Check if noisetorch is already installed
  ansible.builtin.stat:
    path: "{{ user.home }}/.local/bin/noisetorch"
  register: noisetorch_binary

- name: Install Noisetorch
  when: not noisetorch_binary.stat.exists
  block:
    - name: Download NoiseTorch archive
      retries: 5
      delay: 20
      register: result
      until: result is success
      ansible.builtin.get_url:
        url: "https://github.com/noisetorch/NoiseTorch/releases/download/v0.12.2/NoiseTorch_x64_v0.12.2.tgz"
        dest: "/tmp/NoiseTorch_x64_v0.12.2.tgz"

    - name: Extract NoiseTorch archive
      ansible.builtin.shell: |
        tar -C {{ user.home }} -h -xzf NoiseTorch_x64_v0.12.2.tgz && \
        gtk-update-icon-cache
      args:
        chdir: "/tmp"

    - name: Set setcap for noisetorch
      ansible.builtin.shell: |
        setcap 'CAP_SYS_RESOURCE=+ep' {{ user.home }}/.local/bin/noisetorch
      become: true

  rescue:
    - name: Log NoiseTorch installation failure
      ansible.builtin.debug:
        msg: >
          Failed to install NoiseTorch.
          Error details: {{ ansible_failed_result | default('Unknown error') }}
          You may need to run 'tar -C $HOME -h -xzf NoiseTorch_x64_v0.12.2.tgz && gtk-update-icon-cache' manually.
      tags: ["noisetorch_install"]

    - name: Mark NoiseTorch installation as failed
      ansible.builtin.set_fact:
        noisetorch_installation_failed: true
      tags: ["noisetorch_install"]

  tags: ["noisetorch", "audio", "common"]



