---
# tasks file for podman role

- name: Install Podman and related packages
  ansible.builtin.dnf:
    name: "{{ podman_packages }}"
    state: present
  when: podman_install | bool

- name: Ensure rootless podman configuration (optional/check)
  ansible.builtin.debug:
    msg: "Podman is installed. Rootless operation is standard on RHEL/Fedora."
