    - name: "kernel-modules"
      version: "*"
    - name: "kernel-modules-core"
      version: "*"
    - name: "kernel-module-extra"
      version: "*"
    - name: "kernel-tools"
      version: "*"
    - name: "kernel-tools-libs"
      version: "*"
    - name: "anaconda"
      version: "*"
    - name: "anaconda-gui"
      version: "*"
    - name: "bash"
      version: "*"
    - name: "coreutils"
      version: "*"
    - name: "bind-utils"
      version: "*"
    - name: "erofs-utils"
      version: "*"
    - name: "nbd"
      version: "*"
    - name: "cifs-utils"
      version: "*"
    - name: "bluez"
      version: "*"
    - name: "nfs-utils"
      version: "*"
    - name: "rsync"
      version: "*"
    - name: "tar"
      version: "*"
    - name: "python3-libdnf5"
      version: "*"
    - name: "fedora-workstation-repositories"
      version: "*"
    - name: "dnf-plugins-core"
      version: "*"
    - name: "ansible"
      version: "*"
    - name: "ansible-collection-ansible-posix"
      version: "*"
    - name: "ansible-collection-community-general"
      version: "*"
    - name: "ansible-collection-community-docker"
      version: "*"
    - name: "ansible-collection-community-podman"
      version: "*"
    - name: "ansible-collection-community-postgresql"
      version: "*"
    - name: "ansible-collection-community-libvirt"
      version: "*"
    - name: "ansible-collection-community-library_inventory_filtering_v1"
      version: "*"
    - name: "linux-system-roles"
      version: "*"
    - name: "NetworkManager"
      version: "*"
    - name: "NetworkManager-config-connectivity-fedora"
