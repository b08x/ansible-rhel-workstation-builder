    - name: "virt-viewer"
      version: "*"
    - name: "virt-manager"
      version: "*"
    - name: "qemu-kvm"
      version: "*"
    - name: "qemu-img"
      version: "*"
    - name: "ebtables"
      version: "*"
    - name: "dnsmasq"
      version: "*"
    - name: "libguestfs-tools"
      version: "*"
    - name: "bridge-utils"
      version: "*"
  containers:
    - name: "docker-ce"
      version: "*"
    - name: "docker-ce-cli"
      version: "*"
    - name: "docker-compose-plugin"
      version: "*"
    - name: "docker-buildx-plugin"
      version: "*"
    - name: "podman"
      version: "*"
    - name: "podman-compose"
      version: "*"



customizations:
  timezone:
    timezone: "America/New_York"
    ntpservers:
      - "0.pool.ntp.org"
      - "1.pool.ntp.org"
  locale:
    languages:
      - "en_US.UTF-8"
    keyboard: "us"
  user:
    name: "devuser"
    description: "Development User"
    password: "$6$randomsalt$examplehashedpasswordstring"
    shell: "/bin/bash"
    key: "ssh-rsa AAAAB3NzaC1yc2EAAAABIwAAAQEArExampleKeyString user@hostname"
    groups:
      - "wheel"
      - "docker"
  files: